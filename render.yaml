services:
  # 后端服务
  - name: learning-notes-server
    type: web
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    plan: free

  # 前端服务（静态站点）
  - name: learning-notes-client
    type: static_site
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://learning-notes-server.onrender.com
    plan: free
